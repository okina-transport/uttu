## OIDC Configuration
com.c4-soft.springaddons.oidc.ops[0].iss=https://lumidata.dev.okina.fr/auth/realms/Mobi-iti
com.c4-soft.springaddons.oidc.ops[0].username-claim=preferred_username
com.c4-soft.springaddons.oidc.ops[0].authorities[0].prefix=ROLE_
com.c4-soft.springaddons.oidc.ops[0].authorities[0].path[0]=$.realm_access.roles
com.c4-soft.springaddons.oidc.ops[0].authorities[0].path[1]=$.resource_access.*.roles
com.c4-soft.springaddons.oidc.cors[0].allowed-origin-patterns=*
com.c4-soft.springaddons.oidc.cors[0].path=*

com.c4-soft.springaddons.oidc.resourceserver.permit-all[0]=**

